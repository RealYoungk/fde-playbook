name: web_app
description: 시나리오 비교 웹 (Jaspr 서버 렌더링 + shelf API). ops_core를 화면과 API로 노출한다.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.5
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  ops_core:
    path: ../core

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.5
  lints: ^5.0.0
  test: ^1.25.0

jaspr:
  mode: server
